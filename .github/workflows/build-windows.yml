name: Build CRT TV Browser for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - electron-browser
    paths:
      - 'package.json'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRT-TV-Browser-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
